plugins {
    id 'java'
}

group = 'org.example'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
//    implementation group: 'org.seleniumhq.selenium', name: 'selenium-java', version: '4.16.1'
    implementation group: 'org.seleniumhq.selenium', name: 'selenium-java', version: '4.31.0'
//    implementation group: 'org.testng', name: 'testng', version: '7.4.0'
    implementation group: 'org.testng', name: 'testng', version: '7.11.0'
    implementation 'ch.qos.logback:logback-classic:1.4.7'
}

test {
    useTestNG()

}